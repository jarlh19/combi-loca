  <text x="84" y="470" font-family="'Segoe UI', Arial, sans-serif" font-size="36" font-weight="700" fill="#fff6e0">¿Cuánto recaudas antes de chocar?</text>
  <text x="84" y="520" font-family="'Segoe UI', Arial, sans-serif" font-size="24" fill="#cfc4e6">Sube pasajeros, esquiva el tráfico, entra al ranking.</text>
